#
# Local development environment
# Only essential services for running Django and React locally
# django와 react를 로컬 개발 환경에서 실행하기 위한 필수 인프라를 제공하는 컴포즈 파일입니다.
#
# 사용법:
#   docker compose -f docker-compose.local.yml up -d
# 참고:
#    1. 해당 파일로 인프라 올린 후
#    2. 루트에서 python manage.py runserver 0.0.0.0:7000 실행(가상환경 활성화 체크하고 실행 + 최초 실행시 README.md 의 DB 초기화 참고)
#    3. (별도 터미널) rqworker 실행 - 백그라운드 작업(import/export/annotation 등) 처리용(마찬가지로 가상환경 활성화 체크하기)
#       python manage.py rqworker import export annotation webhooks notifications quality_reports cleaning chunks consensus
#    4. `cd cvat-ui`로 이동 후 `yarn run start:cvat-ui` 실행(최초 혹은 의존성 변경 시 그 전에 `yarn install`도 같이 실행)
#

name: dotdot-local-dev

services:
  cvat_db:
    container_name: cvat_db
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_DB: cvat
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - cvat_db:/var/lib/postgresql/data

  cvat_redis_inmem:
    container_name: cvat_redis_inmem
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '100', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - cvat_inmem_db:/data

  cvat_redis_ondisk:
    container_name: cvat_redis_ondisk
    image: apache/kvrocks:2.12.1
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:6666:6666'
    volumes:
      - cvat_cache_db:/var/lib/kvrocks

  cvat_opa:
    container_name: cvat_opa
    image: openpolicyagent/opa:1.12.2
    restart: unless-stopped
    ports:
      - '127.0.0.1:8181:8181'
    command:
      - run
      - --server
      - --addr=:8181
      - --log-level=error
      - --set=services.cvat.url=http://host.docker.internal:7000
      - --set=bundles.cvat.service=cvat
      - --set=bundles.cvat.resource=/api/auth/rules
      - --set=bundles.cvat.polling.min_delay_seconds=5
      - --set=bundles.cvat.polling.max_delay_seconds=15

volumes:
  cvat_db:
  cvat_inmem_db:
  cvat_cache_db:
