# ============================================================
# Deploy on main dotdot (AWS EC2)
#
# [CI] main 브랜치 push 시 자동 실행
#   - Docker 이미지 빌드 (server + UI)
#   - ECR에 :latest 태그로 push
#
# [CD] 배포는 수동으로 EC2 접속 후 아래 절차 실행 (작업 디렉터리: /opt/cvatdotdot)
#
#   0. 배포 경로에 .env 준비: CVAT_POSTGRES_PASSWORD, CVAT_HOST(2dot.ai), LE_EMAIL 필수
#
#   1. ECR 로그인
#      aws ecr get-login-password --region ap-northeast-2 | \
#        docker login --username AWS --password-stdin 895409929723.dkr.ecr.ap-northeast-2.amazonaws.com
#
#   2. 최신 이미지 pull
#      docker compose -f docker-compose.yml -f docker-compose.main.yml pull
#
#   3. DB 마이그레이션 (migrations/ 에 새 파일이 생긴 경우, 불확실하면 매번 실행해도 무방)
#      docker compose -f docker-compose.yml -f docker-compose.main.yml run --rm cvat_server init
#
#   4. 서비스 재기동
#      docker compose -f docker-compose.yml -f docker-compose.main.yml up -d
#
#   5. .env 삭제 (배포 완료 후 비밀번호 평문 파일 정리)
#      rm -f .env
# ============================================================

name: Deploy on main dotdot (AWS EC2)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

    env:
      ECR_REGISTRY: 895409929723.dkr.ecr.ap-northeast-2.amazonaws.com
      SERVER_REPO: bytesize/main-dotdot-server
      UI_REPO: bytesize/main-dotdot-ui

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.ECR_REGISTRY }}/${{ env.SERVER_REPO }}:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
          load: true

      - name: Build UI Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.ui
          build-args: NGINX_CONF=react_nginx.conf
          tags: ${{ env.ECR_REGISTRY }}/${{ env.UI_REPO }}:latest
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui
          load: true

      - name: Push Images to ECR
        run: |
          docker push $ECR_REGISTRY/$SERVER_REPO:latest
          docker push $ECR_REGISTRY/$UI_REPO:latest
          echo "✅ 이미지 ECR push 완료"

