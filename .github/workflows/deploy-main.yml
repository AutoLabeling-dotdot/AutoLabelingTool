# ============================================================
# Deploy on main dotdot (AWS EC2)
#
# [CI] main 브랜치 push 시 자동 실행
#   - Docker 이미지 빌드 (server + UI)
#   - ECR에 :latest 태그로 push
#
# [CD] 배포는 수동으로 EC2 접속 후 아래 절차 실행
#
#   1. ECR 로그인
#      aws ecr get-login-password --region ap-northeast-2 | \
#        docker login --username AWS --password-stdin 895409929723.dkr.ecr.ap-northeast-2.amazonaws.com
#
#   2. 최신 이미지 pull
#      docker compose -f docker-compose.yml -f docker-compose.main.yml pull
#
#   3. DB 마이그레이션 (migrations/ 에 새 파일이 생긴 경우, 불확실하면 매번 실행해도 무방)
#      docker compose -f docker-compose.yml -f docker-compose.main.yml run --rm cvat_server init
#
#   4. 서비스 재기동
#      docker compose -f docker-compose.yml -f docker-compose.main.yml up -d
# ============================================================

name: Deploy on main dotdot (AWS EC2)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

    env:
      ECR_REGISTRY: 895409929723.dkr.ecr.ap-northeast-2.amazonaws.com
      SERVER_REPO: bytesize/main-dotdot-server
      UI_REPO: bytesize/main-dotdot-ui

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Server Image
        run: |
          docker build \
            -t $ECR_REGISTRY/$SERVER_REPO:latest \
            -f Dockerfile .

      - name: Build UI Image
        run: |
          docker build \
            --build-arg NGINX_CONF=react_nginx.conf \
            -t $ECR_REGISTRY/$UI_REPO:latest \
            -f Dockerfile.ui .

      - name: Push Images to ECR
        run: |
          docker push $ECR_REGISTRY/$SERVER_REPO:latest
          docker push $ECR_REGISTRY/$UI_REPO:latest
          echo "✅ 이미지 ECR push 완료"

