services:
  cvat_ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
      args:
        NGINX_CONF: ${NGINX_CONF}
    image: cvat/ui:${CVAT_VERSION:-dev}

  cvat_server:
    build:
      context: .
      dockerfile: Dockerfile
    image: cvat/server
    environment:
      CVAT_SERVERLESS: 1
      CVAT_NUCLIO_HOST: ${NUCLIO_HOST}
      CVAT_NUCLIO_INVOKE_METHOD: dashboard

  cvat_worker_utils:
    build:
      context: .
      dockerfile: Dockerfile
    image: cvat/server

  cvat_worker_import:
    build:
      context: .
      dockerfile: Dockerfile
    image: cvat/server

  cvat_worker_export:
    build:
      context: .
      dockerfile: Dockerfile
    image: cvat/server

  cvat_worker_annotation:
    build:
      context: .
      dockerfile: Dockerfile
    image: cvat/server
    environment:
      CVAT_NUCLIO_HOST: ${NUCLIO_HOST}
      CVAT_NUCLIO_INVOKE_METHOD: dashboard

  cvat_worker_webhooks:
    build:
      context: .
      dockerfile: Dockerfile
    image: cvat/server

  cvat_worker_quality_reports:
    build:
      context: .
      dockerfile: Dockerfile
    image: cvat/server

  cvat_worker_chunks:
    build:
      context: .
      dockerfile: Dockerfile
    image: cvat/server

  cvat_worker_consensus:
    build:
      context: .
      dockerfile: Dockerfile
    image: cvat/server

  # dev(self-hosted)는 Traefik web 진입점이 :8080이라 표준 포트가 아니다.
  # base의 GF_SERVER_ROOT_URL(포트 없음)로는 Grafana가 생성하는 리다이렉트/URL이
  # 포트 80을 가리켜 대시보드가 깨지므로, 실제 서빙 포트(:8080)를 명시한다.
  cvat_grafana:
    environment:
      GF_SERVER_ROOT_URL: http://${CVAT_HOST:-localhost}:8080/analytics